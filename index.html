<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹 Digital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root {
  --bg: #0D1B2A;
  --surface: #152233;
  --border: rgba(96,165,250,.15);
  --fg: #F1F5F9;
  --fg2: #94A3B8;
  --accent: #60A5FA;
  --blue: #1D4ED8;
  --serif: "Noto Serif SC", Georgia, serif;
  --sans: "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  display: flex;
  align-items: center;
  justify-content: center;
}
body { padding: 24px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
}

.logo {
  font-family: var(--serif);
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.tagline {
  font-size: 12px;
  color: var(--fg2);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 40px;
}

.input-wrap {
  position: relative;
  margin-bottom: 16px;
}
input[type="password"] {
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 48px 14px 18px;
  font-family: var(--sans);
  font-size: 16px;
  color: var(--fg);
  outline: none;
  transition: border-color .2s;
  letter-spacing: 2px;
}
input[type="password"]:focus {
  border-color: var(--accent);
}
input[type="password"]::placeholder {
  letter-spacing: 0;
  color: var(--fg2);
  font-size: 13px;
}

.toggle-btn {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--fg2); cursor: pointer;
  font-size: 16px; padding: 4px;
  transition: color .2s;
}
.toggle-btn:hover { color: var(--accent); }

.enter-btn {
  width: 100%;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 40px;
  padding: 14px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 20px rgba(29,78,216,.35);
  letter-spacing: .5px;
}
.enter-btn:hover { background: #2563EB; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(29,78,216,.45); }
.enter-btn:active { transform: none; }

.error {
  margin-top: 14px;
  font-size: 12px;
  color: #F87171;
  min-height: 18px;
  transition: opacity .2s;
}

.footer-note {
  margin-top: 36px;
  font-size: 11px;
  color: var(--fg2);
  opacity: .5;
  letter-spacing: .5px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎋 竹 Digital</div>
  <div class="tagline">内部开发中 · Under Construction</div>

  <div class="input-wrap">
    <input type="password" id="pw" placeholder="输入访问密码" autofocus autocomplete="off">
    <button class="toggle-btn" onclick="togglePw()" title="显示/隐藏密码">👁</button>
  </div>

  <button class="enter-btn" onclick="check()">进入 →</button>
  <div class="error" id="err"></div>

  <div class="footer-note">zhudigital.com.au</div>
</div>

<script>
const H = '7fd8e0f0e9a1d5c3b2e6f4a0c9d7b1e5f3a2d6c8b0e4f2a1d5c9b3e7f1a4d8';

function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  }
  return Math.abs(h).toString(16).padStart(8,'0');
}

function check() {
  const val = document.getElementById('pw').value;
  const err = document.getElementById('err');
  // simple check - password is Woainimen^^^^
  if (val === atob('V29haW5pbWVuXl5eXg==')) {
    sessionStorage.setItem('zd_auth', '1');
    window.location.href = 'consultant_cn.html';
  } else {
    err.textContent = '密码不正确，请重试';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
    setTimeout(() => err.textContent = '', 3000);
  }
}

function togglePw() {
  const pw = document.getElementById('pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') check();
});

// If already authenticated this session, skip
if (sessionStorage.getItem('zd_auth') === '1') {
  window.location.href = 'consultant_cn.html';
}
</script>
</body>
</html>
